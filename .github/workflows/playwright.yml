name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Checkout app under test
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test

      - name: Start app under test
        working-directory: app-under-test
        run: |
          echo "SPRINT=sprint5" > .env
          docker compose -f docker-compose.yml up -d --build

      - name: Wait for services and seed database
        working-directory: app-under-test
        run: |
          npx wait-on http://localhost:4200 http://localhost:8091

      - name: Wait for database to be ready
        working-directory: app-under-test
        run: |
          for i in {1..30}; do
          docker compose exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent && break
          echo "Waiting for MariaDB..."
          sleep 2
          done

      - name: Check Laravel .env and APP_KEY
        working-directory: app-under-test
        run: |
          docker compose exec -T laravel-api ls -la .env || echo ".env MISSING"
          docker compose exec -T laravel-api grep APP_KEY .env || echo "no APP_KEY line found"

      - name: Run migrations and seed
        working-directory: app-under-test
        run: |
          docker compose exec -T laravel-api php artisan migrate:fresh --seed

      # - name: Enable debug mode temporarily
      #   working-directory: app-under-test
      #   run: |
      #     docker compose exec -T laravel-api sed -i 's/APP_DEBUG=false/APP_DEBUG=true/' .env
      #     docker compose exec -T laravel-api php artisan config:clear

      # - name: Curl with debug enabled
      #   run: curl -s http://localhost:8091/products | head -c 3000

      - name: Test backend logic directly (bypass HTTP layer)
        working-directory: app-under-test
        run: |
          docker compose exec -T laravel-api php artisan tinker --execute="
            echo 'Category count: ' . App\Models\Category::count() . PHP_EOL;
            echo 'Product count: ' . App\Models\Product::count() . PHP_EOL;
            \$tree = app(App\Services\CategoryService::class)->getCategoriesTree(null);
            echo 'Tree fetched OK, count: ' . count(\$tree) . PHP_EOL;
          "

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Sanity check API before running tests
        working-directory: app-under-test
        run: |
          echo "--- Direct curl to API ---"
          echo "--- Direct curl to API ---"
          curl -s -w "\nHTTP Status: %{http_code}\n" http://localhost:8091/products || true

          echo "--- laravel-api container logs (stdout/stderr) ---"
          docker compose logs laravel-api --tail=100

          echo "--- storage/logs directory listing ---"
          docker compose exec -T laravel-api ls -la storage/logs || echo "storage/logs missing"

          echo "--- storage directory listing ---"
          docker compose exec -T laravel-api ls -la storage || echo "storage missing"

      - name: Run Playwright tests
        run: npx playwright test --project=setup
        env:
          UI_BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
          CUSTOMER_EMAIL: ${{ vars.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Add report summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          npx playwright show-report --reporter=list playwright-report >> $GITHUB_STEP_SUMMARY 2>&1 || true

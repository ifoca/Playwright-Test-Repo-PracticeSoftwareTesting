name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers (full, cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Checkout app under test
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git app-under-test

      - name: Start app under test
        working-directory: app-under-test
        run: |
          echo "SPRINT=sprint5" > .env
          docker compose -f docker-compose.yml up -d --build

      - name: Fix storage permissions
        working-directory: app-under-test
        run: |
          docker compose exec -u root -T laravel-api chmod -R 777 storage bootstrap/cache

      - name: Wait for services
        working-directory: app-under-test
        run: |
          npx wait-on http://localhost:4200 http://localhost:8091

      - name: Wait for database to be ready
        working-directory: app-under-test
        run: |
          for i in {1..30}; do
          docker compose exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent && break
          echo "Waiting for MariaDB..."
          sleep 2
          done

      - name: Run migrations and seed
        working-directory: app-under-test
        run: |
          docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          UI_BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
          CUSTOMER_EMAIL: ${{ vars.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Add report summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          npx playwright show-report --reporter=list playwright-report >> $GITHUB_STEP_SUMMARY 2>&1 || true
